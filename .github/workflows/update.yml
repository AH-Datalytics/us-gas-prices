name: Daily Data Update

on:
  schedule:
    - cron: '0 12 * * *'  # 7 AM CT (noon UTC)
  workflow_dispatch:        # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run daily update (EIA + AAA)
        timeout-minutes: 20
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/update.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/us_energy.db
          git diff --cached --quiet || git commit -m "Auto-update database [skip ci]"
          git push

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Deploy to Vercel
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL=$(npx vercel --prod --yes --token $VERCEL_TOKEN --scope ahdatalytics 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | head -1)
          echo "Deployed to: $DEPLOY_URL"
          if [ -n "$DEPLOY_URL" ]; then
            npx vercel alias $DEPLOY_URL us-gas-prices-ahd.vercel.app --token $VERCEL_TOKEN --scope ahdatalytics
          fi
