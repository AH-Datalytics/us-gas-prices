name: Daily Data Update

on:
  schedule:
    - cron: '0 14 * * *'  # 9 AM CT (2 PM UTC)
  workflow_dispatch:        # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run daily update (EIA + AAA)
        timeout-minutes: 20
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/update.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f web/us_energy.db
          git diff --cached --quiet || git commit -m "Auto-update database [skip ci]"
          git push

      # Data is collected daily (AAA only publishes the current day, so skipping
      # days would lose history), but the site is deployed only on Mondays or on a
      # manual run. Changed 2026-11-25: each deploy is a billed Vercel build.
      - name: Decide whether to deploy
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Not Monday; data committed, deploy skipped."
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        if: steps.gate.outputs.deploy == 'true'
        working-directory: web
        run: npm ci

      - name: Build
        if: steps.gate.outputs.deploy == 'true'
        working-directory: web
        run: npm run build

      - name: Deploy to Vercel
        if: steps.gate.outputs.deploy == 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL=$(npx vercel --prod --yes --token $VERCEL_TOKEN --scope ahdatalytics 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | head -1)
          echo "Deployed to: $DEPLOY_URL"
          if [ -n "$DEPLOY_URL" ]; then
            npx vercel alias $DEPLOY_URL us-gas-prices-ahd.vercel.app --token $VERCEL_TOKEN --scope ahdatalytics
          fi
